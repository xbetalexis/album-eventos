<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Álbum del evento</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="hero">
    <div class="overlay"></div>
    <section class="card">
      <p class="eyebrow" id="tipo">MIS XV</p>
      <h1 id="nombre">Sophia</h1>
      <p class="fecha" id="fecha">6 de noviembre de 2026</p>
      <p class="mensaje" id="mensaje">Compartí tus fotos y recuerdos de esta noche tan especial.</p>

      <div class="actions">
        <a id="subir" class="btn btn-primary" href="#" target="_blank" rel="noopener">📸 Subir fotos</a>
        <a id="ver" class="btn btn-secondary" href="#" target="_blank" rel="noopener">🖼️ Ver álbum</a>
      </div>

      <p class="nota">Las fotos se abren en el álbum compartido de Google Fotos.</p>
    </section>
  </main>

  <script src="/eventos.js"></script>
  <script src="/app.js"></script>
</body>
</html>
