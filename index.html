<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Mis XV - Valentina</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <main class="hero">

    <div class="overlay"></div>

    <section class="card">

      <div class="top-decoration">
        <span></span>
        <p id="tipo">MIS XV</p>
        <span></span>
      </div>

      <h1 id="nombre">
        Valentina
      </h1>

      <p class="fecha" id="fecha">
        6 de noviembre de 2026
      </p>

      <div class="diamond">✦</div>

      <p class="mensaje" id="mensaje">
        Esta noche está llena de momentos únicos.
        Ayudame a guardar cada recuerdo compartiendo
        las fotos que captures durante mis XV ✨
      </p>

      <a
        id="subir"
        class="btn"
        href="#"
        target="_blank"
        rel="noopener"
      >

        <span class="btn-icon">
          ✦
        </span>

        <span>
          COMPARTIR MIS FOTOS
        </span>

        <span class="arrow">
          →
        </span>

      </a>

      <p class="nota">
        Compartí tus mejores momentos de esta noche
      </p>

    </section>

  </main>

  <script src="/eventos.js"></script>
  <script src="/app.js"></script>

</body>

</html>
